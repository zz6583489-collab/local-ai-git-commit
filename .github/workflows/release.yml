name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package VSIX
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify version, changelog, and main branch
        shell: pwsh
        run: |
          node scripts/prepare-release.mjs check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit on main.' }
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run package
      - name: Prepare release assets
        run: node scripts/prepare-release.mjs bundle
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release
      - name: Create release with VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          vsix="release/ai-git-commit-${version}.vsix"
          test -s "$vsix"
          test -s "$vsix.sha256"
          test -s release/release-notes.md
          (cd release && sha256sum -c "ai-git-commit-${version}.vsix.sha256")
          gh release create "$GITHUB_REF_NAME" "$vsix" "$vsix.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release/release-notes.md
